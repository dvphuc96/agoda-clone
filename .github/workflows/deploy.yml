name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time. Newer pushes cancel in-progress runs for the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysql, curl, zip, bcmath, gd, intl, pdo, pdo_mysql
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Verify .env is NOT included in artifact
        run: |
          if [ -f .env ]; then
            echo "::error::.env file exists in workspace — refusing to package"
            exit 1
          fi

      - name: Create deploy artifact
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H-%M-%S")
          SHA_SHORT=${GITHUB_SHA::7}
          ARTIFACT_NAME="gostay-${TIMESTAMP}-${SHA_SHORT}.tar.gz"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=${TIMESTAMP}-${SHA_SHORT}" >> $GITHUB_ENV

          tar -czf "$ARTIFACT_NAME" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='.github' \
            --exclude='harness.db*' \
            --exclude='.playwright-mcp' \
            --exclude='.superpowers' \
            --exclude='docs' \
            .

          ls -lh "$ARTIFACT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/known_hosts

      - name: Upload artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "*.tar.gz"
          target: "/tmp/"

      - name: Run deploy.sh on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            # Find the artifact just uploaded (newest .tar.gz in /tmp)
            ARTIFACT=$(ls -t /tmp/gostay-*.tar.gz | head -1)
            sudo /var/www/gostay/scripts/deploy.sh "$ARTIFACT" "${{ github.sha }}"

      - name: Notify Discord (success)
        if: success() && secrets.DISCORD_WEBHOOK_URL != ''
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "✅ GoStay deployed: ${{ github.sha }} — https://${{ secrets.EC2_HOST }}"

      - name: Notify Discord (failure)
        if: failure() && secrets.DISCORD_WEBHOOK_URL != ''
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "❌ GoStay deploy FAILED: ${{ github.sha }}"
