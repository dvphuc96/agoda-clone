; /etc/php/8.3/fpm/pool.d/gostay.conf
; Reload after changes: sudo systemctl reload php8.3-fpm

[gostay]
user = deploy
group = www-data
listen = /run/php/php8.3-fpm-gostay.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
php_admin_value[error_log] = /var/www/gostay/shared/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
