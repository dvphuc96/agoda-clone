services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gostay-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docker
      MYSQL_USER: docker
      MYSQL_PASSWORD: docker
      TZ: 'Asia/Ho_Chi_Minh'
    volumes:
      - ./docker/db/data:/var/lib/mysql
      - ./docker/db/sql:/docker-entrypoint-initdb.d
    ports:
      - "3309:3306"
    networks:
      - gostay
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Laravel Backend (PHP-FPM + Nginx)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gostay-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gostay
    environment:
      - APP_NAME=GoStay
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=docker
      - DB_USERNAME=docker
      - DB_PASSWORD=docker
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - VNPAY_TMN_CODE=
      - VNPAY_HASH_SECRET=
      - VNPAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPAY_RETURN_URL=http://localhost:8000/api/payments/vnpay/callback
      - MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE:-}
      - MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY:-}
      - MOMO_SECRET_KEY=${MOMO_SECRET_KEY:-}
      - MOMO_ENDPOINT=${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      - MOMO_RETURN_URL=${MOMO_RETURN_URL:-http://localhost:8000/api/payments/momo/callback}

  # React Frontend (Vite dev server with live-mounted source)
  frontend:
    image: node:22-alpine
    container_name: gostay-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend
    networks:
      - gostay
    depends_on:
      - backend

  # phpMyAdmin (optional — database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gostay-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gostay

networks:
  gostay:
    driver: bridge

volumes:
  storage:
  frontend_node_modules:
